/* =====================================================================
   Metrocasa · Operations Hub — design system
   1. Tokens   2. Base   3. Componentes   4. Telas   5. Movimento   6. Breakpoints
   Breakpoints (CSS não aceita variável em @media): 1180 notebook · 1024 tablet · 900 layout compacto · 600 celular
   ===================================================================== */

/* 1. TOKENS ---------------------------------------------------------- */
:root{
  /* marca */
  --marca:#C41420; --marca-600:#A5101B; --marca-50:#FBEDEE; --vinho:#5C0A10;
  /* neutros */
  --n0:#FFFFFF; --n25:#FAFAFB; --n50:#F4F5F6; --n100:#ECEDEF; --n150:#E8E9EB; --n200:#D6D8DC; --n300:#B7BBC2; --n500:#5B6068; --n700:#3A3E44; --n900:#1F2226;
  /* semânticas */
  --ok:#1F7A5C; --ok-50:#DDF0E8; --ok-txt:#17604A;
  --alerta:#8A5300; --alerta-50:#FBEBD0; --atencao:#E0A000;
  --erro:var(--marca); --erro-50:var(--marca-50);
  /* estados do tempo */
  --t:var(--vinho); --d:#EBB2AD; --i:var(--n300); --s:var(--marca);
  /* papéis */
  --fundo:var(--n150); --superficie:var(--n0); --texto:var(--n900); --texto-2:var(--n500); --borda:var(--n200); --borda-suave:var(--n100);
  /* tipografia */
  --fonte:Archivo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs-xs:12px; --fs-sm:13px; --fs-base:15px; --fs-md:16px; --fs-lg:20px; --fs-xl:26px; --fs-2xl:34px; --fs-num:24px;
  /* espaço */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px;
  /* forma */
  --r-sm:4px; --r-md:6px; --r-lg:10px; --r-full:999px;
  --e1:0 1px 2px rgba(17,19,22,.05);
  --e2:0 1px 2px rgba(17,19,22,.05),0 4px 12px rgba(17,19,22,.06);
  --e3:0 2px 6px rgba(17,19,22,.08),0 18px 48px rgba(17,19,22,.18);
  /* movimento */
  --d1:120ms; --d2:180ms; --d3:260ms;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-in:cubic-bezier(.4,0,1,1);
  --foco:0 0 0 2px var(--n0),0 0 0 4px var(--marca);
  --barra-h:68px;
}

/* 2. BASE ------------------------------------------------------------ */
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{font-family:var(--fonte);font-size:var(--fs-base);line-height:1.45;color:var(--texto);background:var(--fundo);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus{outline:none}
:focus-visible{box-shadow:var(--foco);border-radius:var(--r-sm)}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.2}
h2{font-size:var(--fs-lg)}
h3{font-size:var(--fs-md)}
code{font-size:.92em;background:var(--n100);padding:1px 5px;border-radius:var(--r-sm)}
.cond{font-stretch:75%;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.sec2{color:var(--texto-2)}
.pq{font-size:var(--fs-sm)}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pular{position:fixed;left:var(--s4);top:-60px;z-index:100;background:var(--n900);color:#fff;padding:var(--s2) var(--s4);border-radius:var(--r-md);text-decoration:none;font-weight:600;transition:top var(--d2) var(--ease)}
.pular:focus{top:var(--s3)}

/* 3. COMPONENTES ----------------------------------------------------- */
/* barra da marca */
.barra{background:var(--marca);color:#fff;position:sticky;top:0;z-index:30}
.barra-in{max-width:1240px;margin:0 auto;padding:0 var(--s6);height:var(--barra-h);display:flex;align-items:center;gap:var(--s7)}
.logo{display:flex;align-items:center;gap:var(--s4);color:#fff;flex:none}
.logo .lg-full{height:48px;display:block}
.logo .lg-casa{height:28px;display:none}
.logo small{font-size:var(--fs-sm);opacity:.9;border-left:1px solid rgba(255,255,255,.45);padding-left:var(--s4);font-weight:500;line-height:1.2}
.menu{display:flex;gap:var(--s1);height:100%;flex:1;min-width:0;position:relative}
.menu button{background:none;border:0;color:rgba(255,255,255,.84);font-weight:600;font-size:14px;padding:0 var(--s3);cursor:pointer;height:100%;white-space:nowrap;position:relative;transition:color var(--d1) var(--ease)}
.menu button:hover{color:#fff}
.menu button.on{color:#fff}
.menu button:focus-visible{box-shadow:inset 0 0 0 2px #fff;border-radius:var(--r-md)}
.menu .ind{position:absolute;bottom:0;height:3px;background:#fff;border-radius:3px 3px 0 0;transition:left var(--d3) var(--ease),width var(--d3) var(--ease);pointer-events:none}
.quem{display:flex;align-items:center;gap:var(--s3);font-size:14px;flex:none}
.quem .estado-mini{display:flex;align-items:center;gap:var(--s2);background:rgba(0,0,0,.18);padding:5px 12px;border-radius:var(--r-full);font-weight:600;font-size:var(--fs-sm);transition:background var(--d2) var(--ease)}
.quem button{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:var(--r-md);padding:6px 12px;cursor:pointer;font-size:var(--fs-sm);font-weight:600;transition:background var(--d1) var(--ease)}
.quem button:hover{background:rgba(255,255,255,.12)}
.quem button:focus-visible{box-shadow:0 0 0 2px #fff}
.bol{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.bol.TAREFA{background:var(--t)}.bol.DISPONIVEL{background:var(--d)}.bol.INTERVALO{background:var(--i)}.bol.FORA{background:var(--n300)}
.barra .bol.TAREFA{background:#fff}.barra .bol.FORA{background:rgba(255,255,255,.45)}

/* página e superfícies */
.pag{max-width:1240px;margin:0 auto;padding:var(--s7) var(--s6) 88px}
.painel{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--r-lg);box-shadow:var(--e1)}
.pad{padding:var(--s5) var(--s6)}
.bloco{margin-top:var(--s7)}
.cab{display:flex;align-items:baseline;gap:var(--s3);margin-bottom:var(--s3);flex-wrap:wrap}
.cab h2,.cab h3{flex:1;min-width:0}
.cab .sec2{font-weight:500}
.rolar{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* botões */
.btn{position:relative;border:1px solid var(--borda);background:var(--superficie);border-radius:var(--r-md);padding:8px 14px;min-height:36px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);white-space:nowrap;line-height:1.2;box-shadow:var(--e1);
  transition:background-color var(--d1) var(--ease),border-color var(--d1) var(--ease),box-shadow var(--d1) var(--ease),transform var(--d1) var(--ease),color var(--d1) var(--ease)}
.btn:hover{border-color:var(--n300);background:var(--n25)}
.btn:active{transform:translateY(1px) scale(.99);box-shadow:none}
.btn.pri{background:var(--marca);border-color:var(--marca);color:#fff}
.btn.pri:hover{background:var(--marca-600);border-color:var(--marca-600)}
.btn.esc{background:var(--n900);border-color:var(--n900);color:#fff}
.btn.esc:hover{background:var(--n700);border-color:var(--n700)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ok:hover{background:#196A4F}
.btn.lim{border-color:transparent;background:transparent;color:var(--texto-2);box-shadow:none}
.btn.lim:hover{color:var(--texto);background:var(--n50)}
.btn.pq{padding:5px 10px;min-height:30px;font-size:var(--fs-sm)}
.btn.gr{padding:12px 20px;min-height:46px;font-size:var(--fs-md)}
.btn[disabled]{opacity:.55;cursor:default;transform:none}
.btn.carregando{color:transparent!important;pointer-events:none}
.btn.carregando::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-color:rgba(127,127,127,.35);border-top-color:var(--n700);animation:gira .7s linear infinite}
.btn.pri.carregando::after,.btn.esc.carregando::after,.btn.ok.carregando::after{border-color:rgba(255,255,255,.35);border-top-color:#fff}
.larg{width:100%}

/* campos */
.campo{display:block;margin-top:var(--s4)}
.campo>span{display:block;font-size:var(--fs-sm);font-weight:600;margin-bottom:6px}
.inp{width:100%;border:1px solid var(--borda);border-radius:var(--r-md);padding:9px 12px;min-height:40px;background:var(--superficie);outline:none;transition:border-color var(--d1) var(--ease),box-shadow var(--d1) var(--ease)}
.inp:hover{border-color:var(--n300)}
.inp:focus{border-color:var(--n900);box-shadow:0 0 0 3px rgba(31,34,38,.08)}
.inp.invalido{border-color:var(--marca);box-shadow:0 0 0 3px rgba(196,20,32,.12);animation:treme .3s var(--ease)}
textarea.inp{min-height:84px;resize:vertical;line-height:1.5}
.pin{font-stretch:75%;font-weight:700;font-size:30px;letter-spacing:.45em;text-align:center;padding:10px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:0 var(--s4)}
.grade .tudo{grid-column:1/-1}
.grade.form-pessoa{grid-template-columns:2fr 1fr 1fr 1fr auto;align-items:end}
.dias{display:flex;flex-wrap:wrap;gap:6px}
.dias label{position:relative}
.dias input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.dias span{display:inline-block;padding:7px 12px;border:1px solid var(--borda);border-radius:var(--r-md);font-weight:600;font-size:14px;min-width:52px;text-align:center;transition:background var(--d1) var(--ease),color var(--d1) var(--ease),border-color var(--d1) var(--ease)}
.dias input:checked + span{background:var(--n900);border-color:var(--n900);color:#fff}
.dias input:focus-visible + span{box-shadow:var(--foco)}

/* etiquetas e marcadores */
.tag{display:inline-flex;align-items:center;font-size:var(--fs-xs);font-weight:600;padding:1px 8px;border-radius:var(--r-sm);white-space:nowrap;line-height:1.6}
.tag.atr{background:var(--marca);color:#fff}
.tag.par{background:var(--alerta-50);color:var(--alerta)}
.tag.ok{background:var(--ok-50);color:var(--ok-txt)}
.tag.cinza{background:var(--n100);color:var(--n700)}
.atrasado{color:var(--marca);font-weight:600}
.ini{width:36px;height:36px;border-radius:50%;background:var(--n900);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--fs-sm);flex:none;font-stretch:90%}
.ini.p{width:24px;height:24px;font-size:10.5px}
.am{width:12px;height:12px;border-radius:2px;display:inline-block;flex:none}
.am.T{background:var(--t)}.am.D{background:var(--d)}.am.I{background:var(--i)}
.am.S{background:repeating-linear-gradient(135deg,rgba(196,20,32,.6) 0 2px,#fff 2px 5px);box-shadow:inset 0 0 0 1px rgba(196,20,32,.6)}

/* tabela */
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{text-align:left;font-size:var(--fs-sm);font-weight:600;color:var(--texto-2);border-bottom:1px solid var(--n900);padding:10px 12px;white-space:nowrap}
.tb td{border-bottom:1px solid var(--borda-suave);padding:11px 12px;vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.tb tr.cl{cursor:pointer;transition:background var(--d1) var(--ease)}
.tb tr.cl:hover td,.tb tr.cl:focus-visible td{background:var(--n25)}
.tb tr.cl:focus-visible{box-shadow:inset 3px 0 0 var(--marca);border-radius:0}
.tb .c{text-align:center}.tb .d{text-align:right}

/* lista de tarefas */
.lista{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--r-lg);box-shadow:var(--e1);overflow:hidden}
.it{display:grid;grid-template-columns:4px 1fr auto auto;gap:var(--s4);align-items:center;padding:13px var(--s4) 13px 0;border-top:1px solid var(--borda-suave);cursor:pointer;transition:background var(--d1) var(--ease)}
.it:first-child{border-top:0}
.it:hover{background:var(--n25)}
.it:focus-visible{box-shadow:inset 0 0 0 2px var(--marca);border-radius:0}
.it .pr{align-self:stretch;border-radius:0 2px 2px 0}
.pr0{background:transparent}.pr1{background:var(--n200)}.pr2{background:var(--vinho)}.pr3{background:var(--marca)}
.it .tt{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .mt{font-size:var(--fs-sm);color:var(--texto-2);display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:2px}
.it.rod{background:#FBF4F4}
.it.rod .tt::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--marca);margin-right:8px;vertical-align:1px;animation:pulsa 1.6s ease-in-out infinite}
.tempo{font-stretch:75%;font-weight:600;font-size:var(--fs-md);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.tempo small{font-weight:400;color:var(--texto-2);font-size:var(--fs-sm)}
.acs{display:flex;gap:6px}

/* ferramentas, seletor e quadro */
.ferr{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;margin-bottom:var(--s4)}
.ferr .inp{width:auto;min-width:160px;padding:7px 10px;min-height:36px}
.ferr .esp{flex:1}
.alt{position:relative;display:inline-flex;border:1px solid var(--borda);border-radius:var(--r-md);background:var(--superficie);padding:2px;box-shadow:var(--e1)}
.alt button{position:relative;z-index:1;border:0;background:none;padding:6px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--texto-2);border-radius:var(--r-sm);transition:color var(--d2) var(--ease)}
.alt button.on{color:#fff}
.alt .ind{position:absolute;top:2px;bottom:2px;border-radius:var(--r-sm);background:var(--n900);transition:left var(--d3) var(--ease),width var(--d3) var(--ease)}
.quadro{display:grid;gap:var(--s4);overflow-x:auto;padding-bottom:var(--s2)}
.coluna{min-width:0}
.coluna .ch{display:flex;justify-content:space-between;font-weight:700;font-size:14px;padding:0 2px var(--s2);border-bottom:2px solid var(--n900);margin-bottom:var(--s3)}
.coluna .ch span{color:var(--texto-2);font-weight:600}
.cartao{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--r-md);padding:11px 12px;margin-bottom:var(--s2);cursor:pointer;border-left:4px solid var(--n200);box-shadow:var(--e1);
  transition:border-color var(--d1) var(--ease),box-shadow var(--d2) var(--ease),transform var(--d2) var(--ease)}
.cartao:hover{border-color:var(--n300);box-shadow:var(--e2);transform:translateY(-1px)}
.cartao:focus-visible{box-shadow:var(--foco)}
.cartao.prx2{border-left-color:var(--vinho)}.cartao.prx3{border-left-color:var(--marca)}.cartao.prx0{border-left-color:var(--borda)}
.cartao.rod{box-shadow:inset 0 0 0 1px var(--marca),var(--e1)}
.cartao .tt{font-weight:600;font-size:14px;margin:0 0 var(--s2);line-height:1.3}
.cartao .rp{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);font-size:var(--fs-sm);color:var(--texto-2)}
.cartao .tg{display:flex;flex-wrap:wrap;gap:var(--s1);margin-bottom:var(--s2)}
.cartao .id{font-size:var(--fs-xs);color:var(--texto-2);margin-bottom:3px}

/* avisos, estados vazios, carregamento */
.nota{background:var(--n50);border-left:3px solid var(--marca);padding:10px 14px;font-size:14px;border-radius:0 var(--r-md) var(--r-md) 0}
.vazio{padding:var(--s7);text-align:center;color:var(--texto-2)}
.aviso{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;background:var(--superficie);border:1px solid var(--marca);border-left-width:4px;border-radius:var(--r-md);padding:12px 16px;margin-bottom:var(--s5);font-weight:500;box-shadow:var(--e1)}
.aviso span{flex:1}
.skel{display:block;border-radius:var(--r-md);background:linear-gradient(90deg,var(--n100) 0,var(--n50) 40%,var(--n100) 80%);background-size:300% 100%;animation:brilho 1.3s ease-in-out infinite}
.skel-linha{height:14px;margin:10px 0}
.skel-bloco{height:120px}
#toast{position:fixed;left:50%;bottom:var(--s6);transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:var(--s2);align-items:center;pointer-events:none}
.tst{display:flex;align-items:center;gap:var(--s2);background:var(--n900);color:#fff;padding:10px 16px;border-radius:var(--r-md);font-size:14px;max-width:90vw;box-shadow:var(--e3);animation:sobe var(--d3) var(--ease)}
.tst::before{content:"";width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.6);flex:none}
.tst.erro{background:var(--marca)}
.tst.ok{background:var(--ok)}
.tst.sai{animation:somedesce var(--d2) var(--ease-in) forwards}
#salvando{position:fixed;top:calc(var(--barra-h) + 8px);right:var(--s4);z-index:90;background:var(--n900);color:#fff;font-size:var(--fs-sm);padding:5px 12px 5px 28px;border-radius:var(--r-full);opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity var(--d2) var(--ease),transform var(--d2) var(--ease)}
#salvando::before{content:"";position:absolute;left:10px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:gira .7s linear infinite}
#salvando.on{opacity:1;transform:none}

/* gaveta, janelas, folha */
.fundo{position:fixed;inset:0;background:rgba(31,34,38,.42);z-index:50;display:flex;justify-content:flex-end}
.fundo.meio{justify-content:center;align-items:center;padding:var(--s4)}
.fundo.base{align-items:flex-end;justify-content:stretch}
.gaveta{background:var(--superficie);width:min(600px,100%);height:100%;overflow-y:auto;padding:var(--s6) var(--s6) 48px;box-shadow:var(--e3);overscroll-behavior:contain}
.janela{background:var(--superficie);border-radius:var(--r-lg);width:min(560px,100%);max-height:92vh;overflow-y:auto;padding:var(--s6);box-shadow:var(--e3)}
.janela.peq{width:min(420px,100%)}
.folha{background:var(--superficie);width:100%;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:var(--s3) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom));box-shadow:var(--e3)}
.folha .puxador{width:40px;height:4px;border-radius:2px;background:var(--n200);margin:0 auto var(--s3)}
.folha button.item{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px var(--s2);border:0;border-top:1px solid var(--borda-suave);background:none;font-weight:600;font-size:var(--fs-md);cursor:pointer;text-align:left}
.folha button.item.on{color:var(--marca)}
.gcab{display:flex;align-items:flex-start;gap:var(--s3);margin-bottom:var(--s4)}
.gcab h2{flex:1;font-size:22px;line-height:1.2}
.ficha{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3) var(--s5);margin:var(--s5) 0;font-size:14px}
.ficha dt{color:var(--texto-2);font-size:var(--fs-sm)}
.ficha dd{margin:2px 0 0;font-weight:500}
.hist{margin:0;padding:0;list-style:none}
.hist li{padding:9px 0;border-top:1px solid var(--borda-suave);font-size:14px;display:grid;grid-template-columns:96px 1fr;gap:10px}
.hist li time{color:var(--texto-2);font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.hist li em{font-style:normal;color:var(--texto-2);display:block;font-size:var(--fs-sm)}
.pingrande{font-stretch:62%;font-weight:700;font-size:64px;letter-spacing:.18em;text-align:center;padding:var(--s4);margin:var(--s4) 0;border:2px dashed var(--marca);border-radius:var(--r-md);color:var(--marca)}
.rodape-janela{display:flex;gap:var(--s2);justify-content:flex-end;margin-top:var(--s5)}
details>summary{cursor:pointer;font-weight:600;list-style:none;display:inline-flex;align-items:center;gap:6px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform var(--d2) var(--ease)}
details[open]>summary::before{transform:rotate(45deg)}
details[open]>:not(summary){animation:abre var(--d3) var(--ease)}

/* 4. TELAS ----------------------------------------------------------- */
/* entrada */
.entrada{min-height:100vh;display:grid;grid-template-columns:minmax(320px,42%) 1fr}
.entrada .lado{background:var(--marca);color:#fff;padding:44px 48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.entrada .lado>*{position:relative}
.entrada .marca-grande{width:min(260px,70%);display:block}
.entrada .marca-dagua{position:absolute!important;right:-18%;bottom:-14%;width:88%;opacity:.09;pointer-events:none}
.entrada .lado h1{font-size:44px;line-height:1.02;font-stretch:80%;font-weight:800;max-width:11ch;margin-top:auto}
.entrada .lado p{opacity:.92;max-width:36ch;margin:14px 0 0}
.entrada .regua{margin-top:36px;height:22px;border-top:2px solid rgba(255,255,255,.9);background:repeating-linear-gradient(90deg,rgba(255,255,255,.9) 0 2px,transparent 2px 10%);background-size:100% 12px;background-repeat:no-repeat}
.entrada .form{display:flex;align-items:center;justify-content:center;padding:var(--s7) var(--s6)}
.entrada .caixa{width:100%;max-width:400px}
.pessoas{margin-top:18px;border-top:1px solid var(--borda)}
.pessoa{display:flex;align-items:center;gap:14px;width:100%;padding:14px var(--s2);border:0;border-bottom:1px solid var(--borda);background:none;cursor:pointer;text-align:left;border-radius:0;transition:background var(--d1) var(--ease),padding var(--d2) var(--ease)}
.pessoa:hover{background:rgba(255,255,255,.6);padding-left:var(--s3)}
.pessoa:hover .nm{color:var(--marca)}
.pessoa .nm{font-weight:700;font-size:17px;flex:1;transition:color var(--d1) var(--ease)}
.pessoa .pf{color:var(--texto-2);font-size:var(--fs-sm)}

/* agora */
.agora{display:grid;grid-template-columns:1fr auto;gap:var(--s6);align-items:end}
.agora .estado{font-size:14px;font-weight:600;color:var(--texto-2);display:flex;align-items:center;gap:var(--s2)}
.agora .estado .bol{width:10px;height:10px}
.agora h1{font-size:var(--fs-2xl);line-height:1.1;margin:var(--s2) 0 6px;font-stretch:88%;font-weight:800;max-width:24ch}
.agora .relogio{font-size:76px;line-height:.9;font-weight:700;font-stretch:62%;color:var(--texto)}
.agora .acoes{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:18px}

/* linha do dia */
.ld-regua{position:relative;height:20px;font-size:var(--fs-xs);color:var(--texto-2)}
.ld-regua span{position:absolute;top:0;transform:translateX(-50%);font-stretch:85%}
.ld-trilho{position:relative;height:34px;background:var(--n100);border-radius:var(--r-sm);overflow:hidden}
.ld-trilho .jor{position:absolute;top:0;bottom:0;background:var(--n50);border-left:1px solid var(--borda);border-right:1px solid var(--borda)}
.ld-trilho .hr{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,.06)}
.sg{position:absolute;top:5px;bottom:5px;border-radius:2px}
.sg.T{background:var(--t)}.sg.D{background:var(--d)}.sg.I{background:var(--i)}
.sg.S{background:repeating-linear-gradient(135deg,rgba(196,20,32,.55) 0 2px,transparent 2px 6px);box-shadow:inset 0 0 0 1px rgba(196,20,32,.55)}
.ld-agora{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--marca)}
.ld-agora::after{content:"";position:absolute;top:-4px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--marca)}
.tot{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:14px}
.tot div{display:flex;align-items:center;gap:var(--s2);font-size:14px}
.tot b{font-size:var(--fs-lg);font-stretch:75%;font-variant-numeric:tabular-nums}
.tot .cob{margin-left:auto;color:var(--texto-2)}

/* rotinas */
.rot-progresso{display:flex;gap:3px;margin:2px 0 var(--s3)}
.rot-progresso i{flex:1;height:6px;border-radius:2px;background:var(--borda);transition:background var(--d3) var(--ease)}
.rot-progresso i.f{background:var(--ok)}
.rot-progresso i.a{background:var(--marca)}
.rot-lin{display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:center;padding:14px 18px;border-top:1px solid var(--borda-suave);transition:opacity var(--d2) var(--ease),background var(--d1) var(--ease)}
.rot-lin:first-child{border-top:0}
.rot-lin:hover{background:var(--n25)}
.rot-lin.off{opacity:.55}
.rot-lin .tt{font-weight:600}
.rot-lin .mt{font-size:var(--fs-sm);color:var(--texto-2);margin-top:2px}
.semana{display:flex;gap:var(--s1)}
.semana div{width:34px;text-align:center;font-size:11px;color:var(--texto-2)}
.semana b{display:block;height:22px;border-radius:3px;margin-top:3px;background:var(--n100)}
.semana .ok b{background:var(--ok)}
.semana .atraso b{background:var(--atencao)}
.semana .nao_feita b{background:var(--marca)}
.semana .pendente b{background:#fff;box-shadow:inset 0 0 0 2px var(--n900)}
.semana .livre b,.semana .antes b{background:repeating-linear-gradient(90deg,var(--n100) 0 3px,transparent 3px 6px)}
.semana .cancelada b{background:var(--i)}
.leg-sem{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:var(--fs-sm);color:var(--texto-2);margin-top:var(--s3)}
.leg-sem span{display:inline-flex;align-items:center;gap:6px}
.leg-sem i{width:14px;height:10px;border-radius:2px;display:inline-block}

/* equipe */
.eq-linha,.eq-regua{display:grid;grid-template-columns:210px 1fr 230px;gap:var(--s5)}
.eq-linha{align-items:center;padding:var(--s4) var(--s6);border-top:1px solid var(--borda-suave)}
.eq-regua{padding:14px var(--s6) 0}
.eq-nome{display:flex;align-items:center;gap:var(--s3);min-width:0}
.eq-nome b{display:block;font-size:var(--fs-md)}
.eq-nome .sec2{font-size:var(--fs-sm);display:flex;align-items:center;gap:6px;white-space:nowrap}
.eq-faz{font-size:var(--fs-sm);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq-num{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:var(--s1)}
.eq-num b{display:block;font-size:var(--fs-num);font-stretch:70%;line-height:1;font-variant-numeric:tabular-nums}
.eq-num b.r{color:var(--marca)}
.eq-num span{font-size:var(--fs-xs);color:var(--texto-2)}

/* resumo */
.grandes{display:grid;grid-template-columns:repeat(6,1fr);background:var(--superficie);border:1px solid var(--borda);border-radius:var(--r-lg);box-shadow:var(--e1);overflow:hidden}
.grandes div{padding:18px var(--s5);border-left:1px solid var(--borda-suave)}
.grandes div:first-child{border-left:0}
.grandes b{display:block;font-size:40px;line-height:1;font-stretch:65%;font-weight:700;font-variant-numeric:tabular-nums}
.grandes b.r{color:var(--marca)}
.grandes span{display:block;font-weight:600;margin-top:6px}
.grandes small{display:block;color:var(--texto-2);font-size:var(--fs-sm)}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5)}
svg.graf text{font-family:var(--fonte);font-size:12px;fill:var(--texto-2)}
svg.graf rect{transform-box:fill-box;transform-origin:bottom}
svg.graf.anima rect{animation:cresce var(--d3) var(--ease) both}

.bnav{display:none}

/* 5. MOVIMENTO ------------------------------------------------------- */
.pag.troca{animation:entra var(--d2) var(--ease)}
.fundo.entra{animation:escurece var(--d3) var(--ease)}
.gaveta.entra{animation:desliza var(--d3) var(--ease)}
.janela.entra{animation:surge var(--d2) var(--ease)}
.folha.entra{animation:sobe var(--d3) var(--ease)}
.fundo.sai{animation:clareia var(--d2) var(--ease-in) forwards}
.fundo.sai .gaveta{animation:recolhe var(--d2) var(--ease-in) forwards}
.fundo.sai .janela{animation:some var(--d2) var(--ease-in) forwards}
.fundo.sai .folha{animation:desce var(--d2) var(--ease-in) forwards}
.sg,.ld-agora{transition:left var(--d3) var(--ease),width var(--d3) var(--ease)}
@keyframes entra{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes desliza{from{transform:translateX(32px);opacity:.5}to{transform:none;opacity:1}}
@keyframes recolhe{to{transform:translateX(32px);opacity:0}}
@keyframes surge{from{transform:scale(.97) translateY(6px);opacity:0}to{transform:none;opacity:1}}
@keyframes some{to{transform:scale(.98);opacity:0}}
@keyframes sobe{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes desce{to{transform:translateY(24px);opacity:0}}
@keyframes somedesce{to{transform:translateY(8px);opacity:0}}
@keyframes escurece{from{background:rgba(31,34,38,0)}}
@keyframes clareia{to{background:rgba(31,34,38,0)}}
@keyframes abre{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes cresce{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes pulsa{50%{opacity:.25}}
@keyframes brilho{0%{background-position:100% 0}100%{background-position:0 0}}
@keyframes treme{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;scroll-behavior:auto!important}
}

/* 6. BREAKPOINTS ----------------------------------------------------- */
@media (max-width:1180px){
  .logo small,.quem .nomeu{display:none}
  .barra-in{gap:var(--s5)}
  .menu button{padding:0 10px}
  .grandes{grid-template-columns:repeat(3,1fr)}
  .grandes div:nth-child(4){border-left:0}
  .grandes div:nth-child(n+4){border-top:1px solid var(--borda-suave)}
}
@media (max-width:1024px){
  .menu{display:none}
  .barra-in{justify-content:space-between}
  .pag{padding-bottom:104px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--superficie);border-top:1px solid var(--borda);z-index:40;padding:4px 4px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(17,19,22,.05)}
  .bnav button{flex:1;border:0;background:none;font-size:var(--fs-xs);font-weight:600;color:var(--texto-2);padding:10px 2px 8px;min-height:48px;cursor:pointer;position:relative;transition:color var(--d1) var(--ease)}
  .bnav button::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--marca);transform:scaleX(0);transition:transform var(--d2) var(--ease)}
  .bnav button.on{color:var(--marca)}
  .bnav button.on::before{transform:scaleX(1)}
  .eq-linha,.eq-regua{grid-template-columns:180px 1fr 200px;gap:var(--s4)}
  #toast{bottom:84px}
}
@media (max-width:900px){
  .barra-in{padding:0 var(--s4);gap:var(--s3)}
  :root{--barra-h:56px}
  .logo .lg-full{display:none}
  .logo .lg-casa{display:block}
  .pag{padding:var(--s5) var(--s4) 104px}
  .entrada{grid-template-columns:1fr}
  .entrada .lado{padding:var(--s6) var(--s5)}
  .entrada .marca-grande{width:170px}
  .entrada .lado h1{font-size:32px;margin-top:28px}
  .entrada .regua{margin-top:22px}
  .agora{grid-template-columns:1fr;gap:6px}
  .agora h1{font-size:var(--fs-xl)}
  .agora .relogio{font-size:58px;order:-1}
  .it{grid-template-columns:4px 1fr auto;padding-right:var(--s3)}
  .it .acs{grid-column:2/-1;justify-content:flex-end}
  .quadro{grid-auto-flow:column;grid-template-columns:none!important;grid-auto-columns:minmax(260px,82vw);scroll-snap-type:x mandatory}
  .coluna{scroll-snap-align:start}
  .eq-linha,.eq-regua{grid-template-columns:1fr;gap:10px;padding-left:var(--s4);padding-right:var(--s4)}
  .eq-regua .vz{display:none}
  .duas,.ficha{grid-template-columns:1fr}
  .grade,.grade.form-pessoa{grid-template-columns:1fr 1fr}
  .grade.form-pessoa .campo:first-child{grid-column:1/-1}
  .rot-lin{grid-template-columns:1fr;gap:10px}
  .ferr .inp{flex:1 1 140px;min-width:0}
  .gaveta{padding:var(--s5) var(--s4) 48px}
}
@media (max-width:600px){
  .grandes{grid-template-columns:1fr 1fr}
  .grandes div{border-left:0!important;border-top:1px solid var(--borda-suave)}
  .grandes div:nth-child(-n+2){border-top:0}
  .grandes div:nth-child(even){border-left:1px solid var(--borda-suave)!important}
  .grade,.grade.form-pessoa{grid-template-columns:1fr}
  .tot{gap:6px 18px}
  .tot .cob{margin-left:0;width:100%}
  .janela{padding:var(--s5)}
  .fundo.meio{align-items:flex-end;padding:0}
  .fundo.meio .janela{border-radius:var(--r-lg) var(--r-lg) 0 0;width:100%;max-height:90vh;padding-bottom:calc(var(--s5) + env(safe-area-inset-bottom))}
  .semana div{width:30px}
  .quem .estado-mini{padding:4px 10px}
}
</style>
</head>

<script>
/* ================== CONFIGURAÇÃO — cole aqui a URL /exec do Apps Script ================== */

function gas(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (window.google && google.script && google.script.run) {
    return new Promise(function (ok, ko) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(ko);
      r[fn].apply(r, args);
    });
  }
  return fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args }) })
    .then(function (r) {
      var tipo = r.headers.get('content-type') || '';
      if (!r.ok || tipo.indexOf('json') < 0) { var e = new Error('HTTP ' + r.status); e.servidor = true; throw e; }
      return r.json();
    })

function grafico(dias) {
  var W = 760, H = 220, pl = 30, pb = 28, pt = 12, n = dias.length;
  var max = Math.max(4, Math.max.apply(null, dias.map(function (d) { return Math.max(d.criadas, d.concluidas); })));
  var step = Math.ceil(max / 4); max = step * 4;
  var bw = (W - pl - 8) / n, y = function (v) { return pt + (H - pt - pb) * (1 - v / max); };
  var anima = S.animarGrafico && MOV; S.animarGrafico = false;
  var s = '<svg class="graf' + (anima ? ' anima' : '') + '" viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Tarefas criadas e concluídas por dia, últimos 14 dias">';
  for (var g = 0; g <= 4; g++) { var v = g * step; s += '<line x1="' + pl + '" x2="' + (W - 4) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="' + (g ? '#ECEDEF' : '#1F2226') + '"/><text x="' + (pl - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>'; }
  dias.forEach(function (d, i) {
    var x = pl + i * bw + bw * .2, w = bw * .28;
    s += '<rect x="' + x + '" y="' + y(d.criadas) + '" width="' + w + '" height="' + (y(0) - y(d.criadas)) + '" fill="#B7BBC2"><title>' + fDia(d.dia) + ': ' + d.criadas + ' criadas</title></rect>';
    s += '<rect x="' + (x + w + 2) + '" y="' + y(d.concluidas) + '" width="' + w + '" height="' + (y(0) - y(d.concluidas)) + '" fill="#C41420"><title>' + fDia(d.dia) + ': ' + d.concluidas + ' concluídas</title></rect>';
    if (n <= 8 || i % 2 === 1) s += '<text x="' + (pl + i * bw + bw / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + fDia(d.dia) + '</text>';
  });
  return s + '</svg>';
}

    '<div class="grandes"><div><b data-conta="' + k.concluidas_7d + '">' + k.concluidas_7d + '</b><span>Entregas</span><small>' + k.criadas_7d + ' tarefas novas</small></div>' +
    '<div><b' + (k.prazo_7d != null ? ' data-conta="' + Math.round(k.prazo_7d * 100) + '" data-suf="%"' : '') + '>' + pct(k.prazo_7d) + '</b><span>No prazo</span><small>' + (k.prazo_base ? 'de ' + plural(k.prazo_base, 'entrega com prazo', 'entregas com prazo') : 'nenhuma entrega com prazo') + '</small></div>' +
    '<div><b class="' + (k.rotinas_7d != null && k.rotinas_7d < .8 ? 'r' : '') + '">' + pct(k.rotinas_7d) + '</b><span>Rotinas no prazo</span><small>' + (k.rotinas_base ? 'de ' + plural(k.rotinas_base, 'ocorrência', 'ocorrências') : 'nenhuma rotina no período') + '</small></div>' +
    '<div><b>' + k.abertas + '</b><span>Em aberto</span><small>hoje</small></div>' +
    '<div><b class="' + (k.atrasadas ? 'r' : '') + '">' + k.atrasadas + '</b><span>Atrasadas</span><small>abertas e com prazo vencido</small></div>' +
    '<div><b>' + k.aguardando + '</b><span>Aguardando terceiros</span><small>dependem de outra área</small></div></div>' +
    '<section class="painel pad bloco"><div class="cab"><h3>Criadas e concluídas por dia</h3><div class="tot" style="margin:0"><div><i class="am" style="background:#B7BBC2"></i>Criadas</div><div><i class="am" style="background:#C41420"></i>Concluídas</div></div></div>' + grafico(r.porDia) + '</section>' +
    '<div class="duas bloco"><section class="painel pad"><h3>Equipe nos 7 dias</h3><div class="rolar" style="margin-top:8px"><table class="tb"><thead><tr><th>Pessoa</th><th class="d">Em tarefa</th><th class="d">Do dia registrado</th><th class="d">Entregas</th><th class="d">Abertas</th></tr></thead><tbody>' +
    r.pessoas.map(function (p) { return '<tr><td><b>' + esc(p.nome) + '</b></td><td class="d num">' + fMin(p.T) + '</td><td class="d num">' + (p.J ? pct(Math.max(0, (p.J - p.S) / p.J)) : '—') + '</td><td class="d num">' + p.concluidas + '</td><td class="d num">' + p.abertas + '</td></tr>'; }).join('') +
    '</tbody></table></div><p class="sec2 pq" style="margin:12px 0 0">“Do dia registrado” é a parte da jornada explicada por registros. Não mede esforço.</p></section>' +
    '<section class="painel pad"><h3>Aguardando terceiros</h3>' + (r.aguardando.length ? '<table class="tb" style="margin-top:8px"><tbody>' + r.aguardando.map(function (a) { return '<tr><td><b>' + esc(a.titulo) + '</b><div class="pq sec2">' + esc(a.responsavel) + ': ' + esc(a.motivo) + '</div></td><td class="pq sec2 d">' + fRel(a.desde) + '</td></tr>'; }).join('') + '</tbody></table>' : '<p class="sec2">Nenhuma tarefa esperando outra área.</p>') + '</section></div>' +
    '<section class="painel pad bloco"><h3>Pendências relevantes</h3><p class="sec2 pq" style="margin:2px 0 8px">Atrasadas ou com prioridade alta</p>' + (r.criticas.length ? '<div class="rolar"><table class="tb"><thead><tr><th>Tarefa</th><th>Responsável</th><th>Prioridade</th><th>Prazo</th><th>Status</th></tr></thead><tbody>' +
    r.criticas.map(function (c) { return '<tr><td><b>' + esc(c.titulo) + '</b> <span class="pq sec2">' + c.id + '</span></td><td>' + esc(c.responsavel) + '</td><td>' + esc(c.prioridade) + '</td><td' + (c.atrasada ? ' class="atrasado"' : '') + '>' + (c.prazo ? fDH(c.prazo) : '—') + '</td><td>' + esc(c.status) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<p class="sec2">Nenhuma pendência relevante.</p>') + '</section>';
}

/* ======================= Pessoas (admin) ======================= */
function carregarAdmin() { return api('admin_usuarios').then(function (d) { if (d) { S.admin = d; if (S.view === 'admin') render(); } }); }
function vAdmin() {
  var a = S.admin;
  if (!a) return esqueleto(4);
  var perf = function (sel, id) { return '<select class="inp" id="' + id + '">' + a.perfis.map(function (p) { return '<option value="' + p + '"' + (p === sel ? ' selected' : '') + '>' + p.charAt(0) + p.slice(1).toLowerCase() + '</option>'; }).join('') + '</select>'; };
  return '<div class="cab"><h2>Pessoas</h2></div><section class="painel pad"><h3>Adicionar pessoa</h3><div class="grade form-pessoa">' +
    '<label class="campo"><span>Nome</span><input class="inp" id="u_nome"></label><label class="campo"><span>Perfil</span>' + perf('ASSISTENTE', 'u_perf') + '</label>' +
    '<label class="campo"><span>Entrada</span><input class="inp" type="time" id="u_ji" value="09:00"></label><label class="campo"><span>Saída</span><input class="inp" type="time" id="u_jf" value="18:00"></label>' +
    '<button class="btn pri" style="margin-top:14px" data-a="criarusuario">Adicionar</button></div></section>' +
    '<section class="painel bloco rolar"><table class="tb"><thead><tr><th>Nome</th><th>Perfil</th><th>Jornada</th><th>Situação</th><th>PIN</th><th></th></tr></thead><tbody>' +
    a.usuarios.map(function (u) {
      var i = u.usuario_id;
      return '<tr><td><input class="inp" id="un_' + i + '" value="' + esc(u.nome) + '" aria-label="Nome"></td><td>' + perf(u.perfil, 'up_' + i) + '</td>' +
        '<td style="white-space:nowrap"><input class="inp" type="time" id="uji_' + i + '" value="' + esc(u.jornada_inicio) + '" style="width:112px" aria-label="Entrada"> às <input class="inp" type="time" id="ujf_' + i + '" value="' + esc(u.jornada_fim) + '" style="width:112px" aria-label="Saída"></td>' +
        '<td><select class="inp" id="ua_' + i + '"><option value="sim"' + (u.ativo === 'sim' ? ' selected' : '') + '>Ativo</option><option value="nao"' + (u.ativo !== 'sim' ? ' selected' : '') + '>Inativo</option></select></td>' +
        '<td>' + (u.bloqueado ? '<span class="tag atr">Bloqueado</span>' : u.pin_temporario ? '<span class="tag par">Temporário</span>' : '<span class="tag ok">Definido</span>') + '</td>' +
        '<td style="white-space:nowrap"><button class="btn esc pq" data-a="salvarusuario" data-id="' + i + '">Salvar</button> <button class="btn pq" data-a="resetpin" data-id="' + i + '">Gerar novo PIN</button></td></tr>';
    }).join('') + '</tbody></table></section>' +
    '<p class="sec2 pq">Permissões por perfil, categorias, prioridades e limites de tempo ficam na aba CONFIG da planilha.</p>';
}
function mostrarPin(r) {
  janela('<h2>PIN temporário de ' + esc(r.nome) + '</h2><div class="pingrande">' + esc(r.pin) + '</div><p class="sec2">Entregue pessoalmente. No primeiro acesso a pessoa cria o próprio PIN e este deixa de valer. Ele não aparece de novo.</p><button class="btn esc larg" data-a="fecha">Anotei</button>');
}

/* ======================= cliques ======================= */
var CARREGA = { criar: 1, salvaredit: 1, comentar: 1, enviarfech: 1, criarusuario: 1, salvarusuario: 1, resetpin: 1, salvarotina: 1, alternarotina: 1, trocarpin: 1, entrar: 0, 'conf-sim': 0 };
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-a]');
  if (!el) return;
  var a = el.getAttribute('data-a'), id = el.getAttribute('data-id');
  if (a === 'fecha' && el.classList.contains('fundo') && ev.target.closest('[data-stop]')) return;
  if (S.busy && el.tagName === 'BUTTON' && a !== 'fecha' && a !== 'nav' && a !== 'mais') return;
  if (el.tagName === 'BUTTON' && CARREGA[a]) el.classList.add('carregando');
  var simples = { exp_ini: 'expediente_iniciar', exp_fim: 'expediente_encerrar', int_ini: 'intervalo_iniciar', int_fim: 'intervalo_encerrar' };
  if (simples[a]) {
    var executar = function () {
      var volta = otimista(PREVER[a]);
      return api(simples[a], {}, true).then(function (st) { if (aplicar(st)) S.fech = null; else volta(); });
    };
    if (a === 'exp_fim') return confirmar('Encerrar o expediente?', S.st.meuEstado.estado === 'TAREFA' ? 'A tarefa em andamento será pausada e o tempo dela fica registrado até agora.' : 'O tempo a partir de agora deixa de contar como expediente.', 'Encerrar expediente', true)
      .then(function (sim) { if (sim) { fechar(true); executar(); } });
    return executar();
  }
  switch (a) {
    case 'conf-sim': var cs = S.confirmar; S.confirmar = null; if (cs) cs(true); break;
    case 'conf-nao': fechar(); break;
    case 'mais':
      folha((S.resto || []).map(function (v) { return '<button class="item' + (S.view === v[0] ? ' on' : '') + '" data-a="nav" data-v="' + v[0] + '">' + v[1] + '<span aria-hidden="true">›</span></button>'; }).join('')); break;
    case 'selu': S.selUser = id; renderLogin(); break;
    case 'voltalogin': S.selUser = null; renderLogin(); break;
    case 'entrar': entrar(); break;
    case 'trocarpin':
      api('trocar_pin', { pin: $('#np1').value.trim(), confirmacao: $('#np2').value.trim() }, true).then(function (st) { if (st) { toast('PIN salvo.', 'ok'); aplicar(st); } }); break;
    case 'sair':
      api('sair', {}, true).then(function () { S.token = null; try { sessionStorage.removeItem('opshub_t'); sessionStorage.removeItem('opshub_st'); } catch (e) {} S.resumo = S.admin = S.fech = null; fechar(); iniciarLogin(); }); break;
    case 'nav': S.view = el.getAttribute('data-v'); fechar(true);
      if (S.view === 'resumo') S.resumo = null; if (S.view === 'fechamento') S.fech = null; if (S.view === 'admin') S.admin = null; if (S.view === 'rotinas') S.rot = null;
      render(); window.scrollTo({ top: 0, behavior: 'instant' }); break;
    case 'modo': S.f.modo = el.getAttribute('data-m'); render(); break;
    case 'abrir': if (ev.target.closest('button')) return; abrirTarefa(id); break;
    case 'fecha': fechar(); break;
    case 'nova': janelaNova(); break;
    case 'criar':
      if (!validar('n_tit', $('#n_tit').value.trim(), 'Escreva o que precisa ser feito.')) { el.classList.remove('carregando'); return; }
      api('tarefa_criar', { titulo: $('#n_tit').value, responsavel_id: $('#n_resp') ? $('#n_resp').value : '', categoria: $('#n_cat').value, prioridade: $('#n_prio').value,
        prazo: $('#n_prazo').value, estimado_min: $('#n_est').value, descricao: $('#n_desc').value }, true)
        .then(function (st) { if (aplicar(st)) { fechar(); toast('Tarefa criada.', 'ok'); } }); break;
    case 'tacao': acaoTarefa(id, el.getAttribute('data-acao'), ''); break;
    case 'aguardar': janelaMotivo('Aguardar terceiros', 'De quem ou de qual retorno esta tarefa depende?', 'aguardar', id, true, 'Marcar como aguardando'); break;
    case 'reabrir': janelaMotivo('Reabrir tarefa', 'Por que ela precisa ser reaberta?', 'reabrir', id, false, 'Reabrir'); break;
    case 'cancelar': janelaMotivo('Cancelar tarefa', 'Por que ela está sendo cancelada?', 'cancelar', id, false, 'Cancelar tarefa'); break;
    case 'motivook':
      var mot = $('#m_mot').value.trim();
      if (el.getAttribute('data-obrig') === '1' && !validar('m_mot', mot, 'Preencha o motivo.')) { el.classList.remove('carregando'); return; }
      var tid = id, ac = el.getAttribute('data-acao'); fechar(); acaoTarefa(tid, ac, mot); break;
    case 'comentar':
      var txt = $('#e_com').value.trim(); if (!txt) return;
      api('tarefa_acao', { tarefa_id: id, acao: 'comentar', motivo: txt }, true).then(function (st) { if (aplicar(st)) abrirTarefa(id); }); break;
    case 'salvaredit':
      var t = S.st.tarefas.find(function (x) { return x.tarefa_id === id; });
      api('tarefa_editar', { tarefa_id: id, versao: t.versao, titulo: $('#e_tit').value, responsavel_id: $('#e_resp') ? $('#e_resp').value : undefined,
        prioridade: $('#e_prio').value, prazo: $('#e_prazo').value, estimado_min: $('#e_est').value, descricao: $('#e_desc').value }, true)
        .then(function (st) { if (aplicar(st)) { toast('Alterações salvas.', 'ok'); abrirTarefa(id); } }); break;
    case 'enviarfech':
      var p = {}; ['realizado', 'concluidas', 'pendente', 'dificuldade', 'terceiros', 'prioridade_amanha'].forEach(function (k) { p[k] = $('#f_' + k).value; });
      api('fechamento_enviar', p, true).then(function (st) { if (aplicar(st)) { toast('Fechamento enviado.', 'ok'); S.fech = null; carregarFech(); } }); break;
    case 'recarregaresumo': S.resumo = null; render(); break;
    case 'novarotina': janelaRotina(null); break;
    case 'editarotina': janelaRotina(S.rot.rotinas.find(function (r) { return r.rotina_id === id; })); break;
    case 'salvarotina': salvarRotina(id); break;
    case 'alternarotina':
      var ro = S.rot.rotinas.find(function (r) { return r.rotina_id === id; });
      api('rotina_salvar', Object.assign({}, ro, { ativo: !ro.ativo }), true).then(function (d) { if (d) { S.rot = d; toast(ro.ativo ? 'Rotina pausada.' : 'Rotina reativada.', 'ok'); atualizar(); } }); break;
    case 'criarusuario':
      api('admin_criar_usuario', { nome: $('#u_nome').value, perfil: $('#u_perf').value, jornada_inicio: $('#u_ji').value, jornada_fim: $('#u_jf').value }, true)
        .then(function (r) { if (r) { mostrarPin(r); S.admin = null; carregarAdmin(); atualizar(); } }); break;
    case 'salvarusuario':
      api('admin_atualizar_usuario', { usuario_id: id, nome: $('#un_' + id).value, perfil: $('#up_' + id).value, jornada_inicio: $('#uji_' + id).value, jornada_fim: $('#ujf_' + id).value, ativo: $('#ua_' + id).value }, true)
        .then(function (r) { if (r) { S.admin = r; toast('Dados salvos.', 'ok'); render(); } }); break;
    case 'resetpin':
      api('admin_reset_pin', { usuario_id: id }, true).then(function (r) { if (r) { mostrarPin(r); S.admin = null; carregarAdmin(); } }); break;
  }
});
function acaoTarefa(id, acao, motivo) {
  var t = S.st.tarefas.find(function (x) { return x.tarefa_id === id; });
  var versao = t ? t.versao : '';
  var volta = PREVER[acao] ? otimista(function (st, iso, ms) { PREVER[acao](st, iso, ms, id); }) : null;
  if (volta && S.drawer) renderDrawer();
  api('tarefa_acao', { tarefa_id: id, acao: acao, motivo: motivo, versao: versao }, true).then(function (st) {
    if (aplicar(st)) { S.fech = null; S.rot = null; if (S.drawer) abrirTarefa(id); }
    else if (volta) { volta(); if (S.drawer) renderDrawer(); }
  });
}
document.addEventListener('input', function (ev) {
  if (ev.target.id === 'fbusca') { S.f.busca = ev.target.value; render(); }
});
document.addEventListener('change', function (ev) {
  var id = ev.target.id;
  if (id === 'fresp') { S.f.resp = ev.target.value; render(); }
  if (id === 'fprio') { S.f.prio = ev.target.value; render(); }
  if (id === 'fconcl') { S.f.concl = ev.target.checked; render(); }
});
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && $('#ovl').firstChild) fechar(); });

/* ======================= relógio ======================= */
function tick() {
  var n = agoraMs();
  document.querySelectorAll('[data-since]').forEach(function (e) { e.textContent = fDur(n - Date.parse(e.getAttribute('data-since'))); });
  document.querySelectorAll('[data-live]').forEach(function (e) { var b = Number(e.getAttribute('data-base')) || 0; e.textContent = fDur(b * 60000 + n - Date.parse(e.getAttribute('data-live'))); });
  document.querySelectorAll('[data-resp]').forEach(function (e) { e.textContent = fMin((n - Date.parse(e.getAttribute('data-resp'))) / 60000); });
}
setInterval(tick, 1000);
setInterval(function () { if (S.token && !S.busy && !document.hidden && !$('#ovl').innerHTML && ['TEXTAREA', 'INPUT', 'SELECT'].indexOf(document.activeElement.tagName) < 0) atualizar(); }, 45000);
document.addEventListener('visibilitychange', function () { if (!document.hidden && S.token && !$('#ovl').innerHTML) atualizar(); });

/* ======================= início ======================= */
(function () {
  var semGas = !(window.google && google.script && google.script.run);
  if (semGas && !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_URL)) {
    $('#app').innerHTML = telaEntrada('<h2>Falta conectar ao servidor</h2><p class="sec2">Abra o index.html, cole a URL da implantação do Apps Script (termina em /exec) na linha <code>var API_URL</code> e publique de novo.</p>');
    return;
  }
  var t = null; try { t = sessionStorage.getItem('opshub_t'); } catch (e) {}
  if (t) {
    S.token = t;
    try { var c = JSON.parse(sessionStorage.getItem('opshub_st') || 'null'); if (c && c.st) { S.st = c.st; S.offset = c.offset; render(); } } catch (e) {}
    api('estado').then(function (st) { if (!aplicar(st)) iniciarLogin(); });
  }
  else iniciarLogin();
})();
</script>
