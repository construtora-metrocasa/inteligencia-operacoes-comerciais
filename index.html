<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C41420">
<title>Operações · Metrocasa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
/* Metrocasa · Operations Hub — linguagem visual
   Vermelho da marca na barra (como no site), página em cinza-concreto, painéis brancos.
   Uma família (Archivo) em larguras diferentes: condensada para números e cronômetro.
   O elemento de destaque é a linha do dia; o resto fica quieto. */
:root{
  --marca:#C41420; --marca-esc:#A5101B; --vinho:#5C0A10;
  --concreto:#E8E9EB; --papel:#FFFFFF; --tinta:#1F2226; --cinza:#6A6F77; --linha:#D6D8DC; --linha-suave:#ECEDEF;
  --t:#5C0A10; --d:#EBB2AD; --i:#B7BBC2; --s:#C41420; --ok:#1F7A5C; --alerta:#B26A00;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Archivo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-stretch:100%;font-size:15px;line-height:1.45;color:var(--tinta);background:var(--concreto);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--marca);outline-offset:2px}
.cond{font-stretch:75%;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.sec2{color:var(--cinza)}
.pq{font-size:13px}
.hide{display:none!important}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:20px}
h3{font-size:16px}

/* ---------- barra da marca ---------- */
.barra{background:var(--marca);color:#fff;position:sticky;top:0;z-index:10}
.barra-in{max-width:1240px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:28px}
.logo{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;flex:none}
.logo img{height:26px;display:block}
.logo .txt{font-weight:800;font-size:22px;letter-spacing:-.03em;font-stretch:112%}
.logo small{font-size:13px;opacity:.85;border-left:1px solid rgba(255,255,255,.45);padding-left:12px;font-weight:500}
.menu{display:flex;gap:4px;height:100%;flex:1;min-width:0}
.menu button{background:none;border:0;color:rgba(255,255,255,.82);font-weight:600;font-size:14px;padding:0 12px;cursor:pointer;height:100%;border-bottom:3px solid transparent;border-top:3px solid transparent;white-space:nowrap}
.menu button:hover{color:#fff}
.menu button.on{color:#fff;border-bottom-color:#fff}
.quem{display:flex;align-items:center;gap:14px;font-size:14px;flex:none}
.quem .estado-mini{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.18);padding:5px 10px;border-radius:999px;font-weight:600;font-size:13px}
.quem button{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:var(--r);padding:5px 10px;cursor:pointer;font-size:13px;font-weight:600}
.quem button:hover{background:rgba(255,255,255,.12)}
.bol{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.bol.TAREFA{background:#fff}.bol.DISPONIVEL{background:var(--d)}.bol.INTERVALO{background:var(--i)}.bol.FORA{background:rgba(255,255,255,.45)}

.pag{max-width:1240px;margin:0 auto;padding:28px 24px 80px}
.painel{background:var(--papel);border:1px solid var(--linha);border-radius:var(--r)}
.pad{padding:20px 22px}
.bloco{margin-top:28px}
.cab{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.cab h2,.cab h3{flex:1}
.cab .sec2{font-weight:500}

/* ---------- botões ---------- */
.btn{border:1px solid var(--linha);background:var(--papel);border-radius:var(--r);padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--cinza)}
.btn.pri{background:var(--marca);border-color:var(--marca);color:#fff}
.btn.pri:hover{background:var(--marca-esc)}
.btn.esc{background:var(--tinta);border-color:var(--tinta);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.lim{border-color:transparent;background:transparent;color:var(--cinza)}
.btn.lim:hover{color:var(--tinta)}
.btn.pq{padding:5px 10px;font-size:13px}
.btn.gr{padding:12px 20px;font-size:16px}
.btn[disabled]{opacity:.5;cursor:wait}
.larg{width:100%;justify-content:center}
.ic{width:12px;height:12px;flex:none}

/* ---------- campos ---------- */
.campo{display:block;margin-top:14px}
.campo>span{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.inp{width:100%;border:1px solid var(--linha);border-radius:var(--r);padding:9px 12px;background:#fff;outline:none}
.inp:focus{border-color:var(--tinta)}
textarea.inp{min-height:76px;resize:vertical;line-height:1.5}
.pin{font-stretch:75%;font-weight:700;font-size:30px;letter-spacing:.45em;text-align:center;padding:10px}

/* ---------- entrada ---------- */
.entrada{min-height:100vh;display:grid;grid-template-columns:minmax(320px,42%) 1fr}
.entrada .lado{background:var(--marca);color:#fff;padding:40px 48px;display:flex;flex-direction:column;justify-content:space-between}
.entrada .lado .logo img{height:34px}
.entrada .lado .logo .txt{font-size:30px}
.entrada .lado h1{font-size:44px;line-height:1.02;font-stretch:80%;font-weight:800;max-width:11ch;margin-top:auto}
.entrada .lado p{opacity:.9;max-width:36ch;margin:14px 0 0}
.entrada .regua{margin-top:36px;height:22px;border-top:2px solid rgba(255,255,255,.9);background:repeating-linear-gradient(90deg,rgba(255,255,255,.9) 0 2px,transparent 2px 10%);background-size:100% 12px;background-repeat:no-repeat}
.entrada .form{display:flex;align-items:center;justify-content:center;padding:32px 24px}
.entrada .caixa{width:100%;max-width:400px}
.pessoas{margin-top:18px;border-top:1px solid var(--linha)}
.pessoa{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;border:0;border-bottom:1px solid var(--linha);background:none;cursor:pointer;text-align:left}
.pessoa:hover .nm{color:var(--marca)}
.pessoa .nm{font-weight:700;font-size:17px;flex:1}
.pessoa .pf{color:var(--cinza);font-size:13px}
.ini{width:36px;height:36px;border-radius:50%;background:var(--tinta);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;font-stretch:90%}
.ini.p{width:24px;height:24px;font-size:10.5px}

/* ---------- agora ---------- */
.agora{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
.agora .estado{font-size:14px;font-weight:600;color:var(--cinza);display:flex;align-items:center;gap:8px}
.agora .estado .bol{width:10px;height:10px}
.agora .estado .bol.TAREFA{background:var(--t)}.agora .estado .bol.FORA{background:var(--i)}
.agora h1{font-size:34px;line-height:1.1;margin:8px 0 6px;font-stretch:88%;font-weight:800;max-width:24ch}
.agora .relogio{font-size:76px;line-height:.9;font-weight:700;font-stretch:62%;color:var(--tinta)}
.agora .acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}

/* ---------- linha do dia ---------- */
.ld{position:relative}
.ld-regua{position:relative;height:20px;font-size:12px;color:var(--cinza)}
.ld-regua span{position:absolute;top:0;transform:translateX(-50%);font-stretch:85%}
.ld-trilho{position:relative;height:34px;background:var(--linha-suave);border-radius:3px;overflow:hidden}
.ld-trilho .jor{position:absolute;top:0;bottom:0;background:#F6F6F7;border-left:1px solid var(--linha);border-right:1px solid var(--linha)}
.ld-trilho .hr{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,.06)}
.sg{position:absolute;top:5px;bottom:5px;border-radius:2px}
.sg.T{background:var(--t)}.sg.D{background:var(--d)}.sg.I{background:var(--i)}
.sg.S{background:repeating-linear-gradient(135deg,rgba(196,20,32,.55) 0 2px,transparent 2px 6px);box-shadow:inset 0 0 0 1px rgba(196,20,32,.55)}
.ld-agora{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--marca)}
.ld-agora:after{content:"";position:absolute;top:-4px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--marca)}
.tot{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:14px}
.tot div{display:flex;align-items:center;gap:8px;font-size:14px}
.tot b{font-size:20px;font-stretch:75%;font-variant-numeric:tabular-nums}
.am{width:12px;height:12px;border-radius:2px;display:inline-block;flex:none}
.am.T{background:var(--t)}.am.D{background:var(--d)}.am.I{background:var(--i)}
.am.S{background:repeating-linear-gradient(135deg,rgba(196,20,32,.6) 0 2px,#fff 2px 5px);box-shadow:inset 0 0 0 1px rgba(196,20,32,.6)}
.tot .cob{margin-left:auto;color:var(--cinza)}

/* ---------- tarefas ---------- */
.lista{background:var(--papel);border:1px solid var(--linha);border-radius:var(--r)}
.it{display:grid;grid-template-columns:4px 1fr auto auto;gap:14px;align-items:center;padding:13px 16px 13px 0;border-top:1px solid var(--linha-suave);cursor:pointer}
.it:first-child{border-top:0}
.it:hover{background:#FAFAFB}
.it .pr{align-self:stretch;border-radius:0 2px 2px 0}
.pr0{background:transparent}.pr1{background:#D2D5DA}.pr2{background:var(--vinho)}.pr3{background:var(--marca)}
.it .tt{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .mt{font-size:13px;color:var(--cinza);display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:2px}
.it.rod{background:#FBF4F4}
.it.rod .tt:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--marca);margin-right:8px;vertical-align:1px;animation:pulsa 1.6s ease-in-out infinite}
@keyframes pulsa{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.it.rod .tt:before{animation:none}}
.tempo{font-stretch:75%;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.tempo small{font-weight:400;color:var(--cinza);font-size:13px}
.acs{display:flex;gap:6px}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:1px 7px;border-radius:3px;white-space:nowrap;line-height:1.5}
.tag.atr{background:var(--marca);color:#fff}
.tag.par{background:#FBEBD0;color:#7A4A00}
.tag.agu{background:#E6E7EA;color:var(--tinta)}
.tag.ok{background:#DCEFE7;color:var(--ok)}
.tag.cinza{background:var(--linha-suave);color:var(--cinza)}
.atrasado{color:var(--marca);font-weight:600}

.ferr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.ferr .inp{width:auto;min-width:150px;padding:7px 10px}
.alt{display:inline-flex;border:1px solid var(--linha);border-radius:var(--r);overflow:hidden;background:#fff}
.alt button{border:0;background:none;padding:7px 12px;cursor:pointer;font-weight:600;font-size:14px;color:var(--cinza)}
.alt button.on{background:var(--tinta);color:#fff}
.quadro{display:grid;gap:14px;overflow-x:auto;padding-bottom:6px}
.coluna{min-width:0}
.coluna .ch{display:flex;justify-content:space-between;font-weight:700;font-size:14px;padding:0 2px 8px;border-bottom:2px solid var(--tinta);margin-bottom:10px}
.coluna .ch span{color:var(--cinza);font-weight:600}
.cartao{background:var(--papel);border:1px solid var(--linha);border-radius:var(--r);padding:11px 12px;margin-bottom:8px;cursor:pointer;border-left:4px solid #D2D5DA}
.cartao:hover{border-color:var(--cinza)}
.cartao.prx2{border-left-color:var(--vinho)}.cartao.prx3{border-left-color:var(--marca)}.cartao.prx0{border-left-color:var(--linha)}
.cartao .tt{font-weight:600;font-size:14px;margin:0 0 8px;line-height:1.3}
.cartao .rp{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--cinza)}
.cartao .tg{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.cartao .id{font-size:12px;color:var(--cinza);margin-bottom:3px}
.cartao.rod{box-shadow:inset 0 0 0 1px var(--marca)}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{text-align:left;font-size:13px;font-weight:600;color:var(--cinza);border-bottom:1px solid var(--tinta);padding:8px 12px;white-space:nowrap}
.tb td{border-bottom:1px solid var(--linha-suave);padding:10px 12px;vertical-align:middle}
.tb tr.cl{cursor:pointer}.tb tr.cl:hover td{background:#FAFAFB}
.tb .c{text-align:center}.tb .d{text-align:right}
.rolar{overflow-x:auto}

/* ---------- equipe ---------- */
.eq-linha{display:grid;grid-template-columns:210px 1fr 170px;gap:20px;align-items:center;padding:16px 22px;border-top:1px solid var(--linha-suave)}
.eq-linha:first-of-type{border-top:0}
.eq-nome{display:flex;align-items:center;gap:12px;min-width:0}
.eq-nome b{display:block;font-size:16px}
.eq-nome .sec2{font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.eq-nome .bol.TAREFA{background:var(--t)}.eq-nome .bol.FORA{background:var(--i)}
.eq-faz{font-size:13px;margin-top:6px;color:var(--tinta);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq-num{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:4px}
.eq-num b{display:block;font-size:24px;font-stretch:70%;line-height:1;font-variant-numeric:tabular-nums}
.eq-num b.r{color:var(--marca)}
.eq-num span{font-size:12px;color:var(--cinza)}
.eq-regua{display:grid;grid-template-columns:210px 1fr 170px;gap:20px;padding:14px 22px 0}

/* ---------- resumo ---------- */
.grandes{display:grid;grid-template-columns:repeat(5,1fr);gap:0;background:var(--papel);border:1px solid var(--linha);border-radius:var(--r)}
.grandes div{padding:18px 22px;border-left:1px solid var(--linha-suave)}
.grandes div:first-child{border-left:0}
.grandes b{display:block;font-size:44px;line-height:1;font-stretch:65%;font-weight:700;font-variant-numeric:tabular-nums}
.grandes b.r{color:var(--marca)}
.grandes span{display:block;font-weight:600;margin-top:6px}
.grandes small{display:block;color:var(--cinza);font-size:13px}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:20px}
svg.graf text{font-family:Archivo,sans-serif;font-size:12px;fill:#6A6F77}

/* ---------- gaveta e janela ---------- */
.fundo{position:fixed;inset:0;background:rgba(31,34,38,.42);z-index:50;display:flex;justify-content:flex-end}
.gaveta{background:var(--papel);width:min(580px,100%);height:100%;overflow-y:auto;padding:24px 26px 48px}
.fundo.meio{justify-content:center;align-items:center;padding:16px}
.janela{background:var(--papel);border-radius:8px;width:min(540px,100%);max-height:92vh;overflow-y:auto;padding:24px}
.gcab{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.gcab h2{flex:1;font-size:22px;line-height:1.2}
.ficha{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin:18px 0;font-size:14px}
.ficha dt{color:var(--cinza);font-size:13px}
.ficha dd{margin:2px 0 0;font-weight:500}
.hist{margin:0;padding:0;list-style:none}
.hist li{padding:9px 0;border-top:1px solid var(--linha-suave);font-size:14px;display:grid;grid-template-columns:92px 1fr;gap:10px}
.hist li time{color:var(--cinza);font-size:13px;font-variant-numeric:tabular-nums}
.hist li em{font-style:normal;color:var(--cinza);display:block;font-size:13px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grade .tudo{grid-column:1/-1}
.pingrande{font-stretch:62%;font-weight:700;font-size:64px;letter-spacing:.18em;text-align:center;padding:16px;margin:16px 0;border:2px dashed var(--marca);border-radius:var(--r);color:var(--marca)}
.nota{background:#F6F6F7;border-left:3px solid var(--marca);padding:10px 14px;font-size:14px;border-radius:0 var(--r) var(--r) 0}
.vazio{padding:28px;text-align:center;color:var(--cinza)}
.aviso{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--papel);border:1px solid var(--marca);border-radius:var(--r);padding:12px 16px;margin-bottom:20px;font-weight:500}
.aviso span{flex:1}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tst{background:var(--tinta);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:14px;max-width:90vw}
.tst.erro{background:var(--marca)}
.tst.ok{background:var(--ok)}
#salvando{position:fixed;top:68px;right:16px;z-index:90;background:var(--tinta);color:#fff;font-size:13px;padding:5px 12px;border-radius:999px;display:none}
#salvando.on{display:block}
.bnav{display:none}

/* ---------- celular ---------- */
@media (max-width:900px){
  .barra-in{padding:0 16px;height:54px;gap:12px}
  .menu{display:none}
  .logo small{display:none}
  .quem .nomeu{display:none}
  .pag{padding:20px 16px 96px}
  .entrada{grid-template-columns:1fr}
  .entrada .lado{padding:24px 20px;min-height:auto}
  .entrada .lado h1{font-size:32px;margin-top:28px}
  .entrada .regua{margin-top:22px}
  .agora{grid-template-columns:1fr;gap:6px}
  .agora h1{font-size:26px}
  .agora .relogio{font-size:58px;order:-1}
  .it{grid-template-columns:4px 1fr auto;padding-right:12px}
  .it .acs{grid-column:2/-1;justify-content:flex-end}
  .quadro{grid-auto-flow:column;grid-template-columns:none!important;grid-auto-columns:82vw;scroll-snap-type:x mandatory}
  .coluna{scroll-snap-align:start}
  .eq-linha,.eq-regua{grid-template-columns:1fr;gap:10px;padding-left:16px;padding-right:16px}
  .eq-regua .vz{display:none}
  .grandes{grid-template-columns:1fr 1fr}
  .grandes div{border-left:0;border-top:1px solid var(--linha-suave)}
  .duas,.grade,.ficha{grid-template-columns:1fr}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--papel);border-top:1px solid var(--linha);z-index:20;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;border:0;background:none;font-size:12px;font-weight:600;color:var(--cinza);padding:10px 2px;cursor:pointer;border-top:3px solid transparent}
  .bnav button.on{color:var(--marca);border-top-color:var(--marca)}
  #salvando{top:62px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="ovl"></div>
<div id="toast"></div>
<div id="salvando">Salvando</div>

<script>
/* ================== CONFIGURAÇÃO — cole aqui a URL /exec do Apps Script ================== */

/* Logo: usa logo.svg da mesma pasta (se você subir um); senão, o logo branco do site oficial. */
var LOGOS = ['logo.svg', 'https://www.metrocasa.com.br/common/logo-white.svg'];
/* ========================================================================================= */

var S = { token: null, st: null, view: null, offset: 0, busy: false, login: null, selUser: null,
  f: { busca: '', resp: '', prio: '', modo: 'quadro', concl: false }, resumo: null, admin: null, fech: null, drawer: null };

/* ======================= comunicação ======================= */
function gas(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (window.google && google.script && google.script.run) {
    return new Promise(function (ok, ko) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(ko);
      r[fn].apply(r, args);
    });
  }
  return fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args }) })

    .then(function (d) { if (d && d.__erro) throw new Error(d.__erro); return d; });

/* ======================= linha do dia ======================= */
function faixa(linhas) {
  var a = Infinity, b = -Infinity;
  linhas.forEach(function (L) {
    if (!L) return;
    a = Math.min(a, L.ji); b = Math.max(b, L.jf);
    L.segs.forEach(function (s) { a = Math.min(a, s.a); b = Math.max(b, s.b); });
    if (L.agora < L.ji + 864e5) b = Math.max(b, Math.min(L.agora, L.ji + 16 * 3600000));
  });
  var h = 3600000;
  return { a: Math.floor(a / h) * h, b: Math.ceil(b / h) * h };
}
function regua(F) {
  var out = '', h = 3600000, n = (F.b - F.a) / h, passo = n > 12 ? 2 : 1;
  for (var t = F.a; t <= F.b; t += h * passo) {
    var x = (t - F.a) / (F.b - F.a) * 100;
    out += '<span style="left:' + x + '%">' + Number(fH(t).slice(0, 2)) + 'h</span>';
  }
  return '<div class="ld-regua" aria-hidden="true">' + out + '</div>';
}
function trilho(L, F) {
  var W = F.b - F.a, pos = function (t) { return ((t - F.a) / W * 100).toFixed(3) + '%'; }, w = function (a, b) { return ((b - a) / W * 100).toFixed(3) + '%'; };
  var h = '<div class="ld-trilho" role="img" aria-label="Linha do dia">';
  h += '<div class="jor" style="left:' + pos(L.ji) + ';width:' + w(L.ji, L.jf) + '" title="Jornada prevista ' + fH(L.ji) + ' às ' + fH(L.jf) + '"></div>';
  for (var t = F.a + 3600000; t < F.b; t += 3600000) h += '<div class="hr" style="left:' + pos(t) + '"></div>';
  L.segs.forEach(function (s) {
    var tit = SEG[s.e] + ', ' + fH(s.a) + ' às ' + fH(s.b) + ' (' + fMin((s.b - s.a) / 60000) + ')' + (s.t ? ': ' + s.t : '') + (s.fora ? ': jornada sem expediente aberto' : '');
    h += '<div class="sg ' + s.e + '" style="left:' + pos(s.a) + ';width:' + w(s.a, s.b) + '" title="' + esc(tit) + '"></div>';
  });
  if (L.agora > F.a && L.agora < F.b) h += '<div class="ld-agora" style="left:' + pos(L.agora) + '" title="Agora"></div>';
  return h + '</div>';
}

    '<div><i class="am D"></i>Disponível <b>' + fMin(h.D) + '</b></div><div><i class="am S"></i>Sem atualização <b>' + fMin(h.S) + '</b></div>' +
    (comCob ? '<div class="cob">' + (h.cobertura == null ? 'Fora da jornada' : pct(h.cobertura) + ' do dia registrado') + '</div>' : '') + '</div>';
}

/* ======================= Tarefas ======================= */

/* ======================= detalhe da tarefa ======================= */
function abrirTarefa(id) {
  S.drawer = { id: id, hist: null };
  renderDrawer();
  api('tarefa_historico', { tarefa_id: id }).then(function (h) { if (S.drawer && S.drawer.id === id && h) { S.drawer.hist = h; renderDrawer(); } });
}
var ACAO_TXT = { CRIOU: 'criou a tarefa', ALTEROU: 'alterou', INICIOU: 'iniciou', RETOMOU: 'retomou', PAUSOU: 'pausou', AGUARDANDO: 'marcou como aguardando terceiros', CONCLUIU: 'concluiu', REABRIU: 'reabriu', CANCELOU: 'cancelou', COMENTOU: 'comentou' };
var CAMPO_TXT = { titulo: 'título', descricao: 'descrição', categoria: 'categoria', prioridade: 'prioridade', estimado_min: 'tempo estimado', prazo: 'prazo', responsavel_id: 'responsável', observacoes: 'observações' };
function detalheEv(e) {
  var d; try { d = JSON.parse(e.detalhe); } catch (x) { return esc(e.detalhe); }
  if (e.acao === 'COMENTOU') return '“' + esc(d.texto) + '”';
  if (e.acao === 'AGUARDANDO') return esc(d.motivo);
  if (e.acao === 'PAUSOU' && d.motivo) return 'motivo: ' + esc(d.motivo);
  if (e.acao === 'ALTEROU') return Object.keys(d).map(function (k) { return esc(CAMPO_TXT[k] || k); }).join(', ');
  if ((e.acao === 'REABRIU' || e.acao === 'CANCELOU') && d.motivo) return esc(d.motivo);
  return '';
}
function renderDrawer() {

  if (!t) { S.drawer = null; $('#ovl').innerHTML = ''; return; }
  var me = S.st.me.usuario_id, coord = pode('tarefa.editar'), dono = t.responsavel_id === me;

  if (!aberta && (dono || coord)) acs += '<button class="btn" data-a="reabrir" data-id="' + t.tarefa_id + '">Reabrir</button>';
  if (aberta && pode('tarefa.cancelar')) acs += '<button class="btn lim" data-a="cancelar" data-id="' + t.tarefa_id + '">Cancelar tarefa</button>';

  }).join('') + '</ul>';
  var ints = !h ? '' : (h.intervalos.length ? '<table class="tb"><thead><tr><th>Começou</th><th>Terminou</th><th class="d">Duração</th></tr></thead><tbody>' + h.intervalos.map(function (i) {
    var fim = i.fim ? Date.parse(i.fim) : agoraMs();
    return '<tr><td>' + fDH(i.inicio) + '</td><td>' + (i.fim ? fH(i.fim) : '<span class="tag atr">rodando</span>') + (i.fechamento === 'automatico' ? ' <span class="tag par">fechado pelo sistema</span>' : '') + '</td><td class="d num">' + fMin((fim - Date.parse(i.inicio)) / 60000) + '</td></tr>';
  }).join('') + '</tbody></table>' : '<p class="sec2 pq">Nenhum tempo registrado ainda.</p>');

    '<label class="campo tudo"><span>Título</span><input class="inp" id="e_tit" value="' + esc(t.titulo) + '"></label>' +
    (pode('tarefa.criar_qualquer') ? '<label class="campo"><span>Responsável</span><select class="inp" id="e_resp">' + S.st.usuarios.map(function (u) { return '<option value="' + u.usuario_id + '"' + (u.usuario_id === t.responsavel_id ? ' selected' : '') + '>' + esc(u.nome) + '</option>'; }).join('') + '</select></label>' : '') +
    '<label class="campo"><span>Prioridade</span><select class="inp" id="e_prio">' + S.st.config.prioridades.map(function (p) { return '<option' + (p === t.prioridade ? ' selected' : '') + '>' + esc(p) + '</option>'; }).join('') + '</select></label>' +
    '<label class="campo"><span>Prazo</span><input class="inp" type="datetime-local" id="e_prazo" value="' + localInput(t.prazo) + '"></label>' +
    '<label class="campo"><span>Tempo estimado, em minutos</span><input class="inp" type="number" min="0" id="e_est" value="' + esc(t.estimado_min) + '"></label>' +
    '<label class="campo tudo"><span>Descrição</span><textarea class="inp" id="e_desc">' + esc(t.descricao) + '</textarea></label>' +
    '</div><button class="btn esc" style="margin-top:12px" data-a="salvaredit" data-id="' + t.tarefa_id + '">Salvar alterações</button></details>' : '';

    '<div style="display:flex;flex-wrap:wrap;gap:8px">' + acs + '</div>' +
    '<dl class="ficha"><div><dt>Responsável</dt><dd>' + esc(t.responsavel) + '</dd></div><div><dt>Pedida por</dt><dd>' + esc(t.solicitante) + '</dd></div>' +
    '<div><dt>Criada</dt><dd>' + fDH(t.criado_em) + '</dd></div><div><dt>Prazo</dt><dd' + (t.atrasada ? ' class="atrasado"' : '') + '>' + (t.prazo ? fDH(t.prazo) : 'sem prazo') + '</dd></div>' +
    '<div><dt>Iniciada</dt><dd>' + fDH(t.iniciado_em) + '</dd></div><div><dt>Concluída</dt><dd>' + fDH(t.concluido_em) + '</dd></div>' +
    '<div><dt>Tempo registrado</dt><dd>' + tempoTarefa(t) + '</dd></div><div><dt>Tempo de resposta</dt><dd>' + resposta + '</dd></div></dl>' +
    (t.descricao ? '<p style="white-space:pre-wrap;margin:0 0 14px">' + esc(t.descricao) + '</p>' : '') +
    (t.observacoes ? '<div class="nota" style="white-space:pre-wrap">' + esc(t.observacoes) + '</div>' : '') +
    edit +

  tick();

  var p = r.pendentes.length ? r.pendentes.map(function (t) { return '<li>' + esc(t.titulo) + ' <span class="sec2">' + esc(t.status).toLowerCase() + (t.min ? ', ' + fMin(t.min) + ' no dia' : '') + '</span> ' + (t.atrasada ? '<span class="tag atr">Atrasada</span> ' : '') + (t.sem_evento_no_dia ? '<span class="tag par">Sem atualização no dia</span>' : '') + '</li>'; }).join('') : '<li class="sec2">Nenhuma</li>';

    '<p style="margin:16px 0 4px;font-weight:600">Concluídas (' + r.concluidas.length + ')</p><ul style="margin:0;padding-left:20px">' + c + '</ul>' +
    '<p style="margin:14px 0 4px;font-weight:600">Pendentes (' + r.pendentes.length + ')</p><ul style="margin:0;padding-left:20px">' + p + '</ul>';

function vFechamento() {

/* ======================= Resumo ======================= */
function carregarResumo() { return api('resumo').then(function (d) { if (d) { S.resumo = d; if (S.view === 'resumo') render(); } }); }
function grafico(dias) {
  var W = 760, H = 220, pl = 30, pb = 28, pt = 12, n = dias.length;
  var max = Math.max(4, Math.max.apply(null, dias.map(function (d) { return Math.max(d.criadas, d.concluidas); })));
  var step = Math.ceil(max / 4); max = step * 4;
  var bw = (W - pl - 8) / n, y = function (v) { return pt + (H - pt - pb) * (1 - v / max); };
  var s = '<svg class="graf" viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Tarefas criadas e concluídas por dia, últimos 14 dias">';
  for (var g = 0; g <= 4; g++) { var v = g * step; s += '<line x1="' + pl + '" x2="' + (W - 4) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="' + (g ? '#ECEDEF' : '#1F2226') + '"/><text x="' + (pl - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>'; }
  dias.forEach(function (d, i) {
    var x = pl + i * bw + bw * .2, w = bw * .28;
    s += '<rect x="' + x + '" y="' + y(d.criadas) + '" width="' + w + '" height="' + (y(0) - y(d.criadas)) + '" fill="#B7BBC2"><title>' + fDia(d.dia) + ': ' + d.criadas + ' criadas</title></rect>';
    s += '<rect x="' + (x + w + 2) + '" y="' + y(d.concluidas) + '" width="' + w + '" height="' + (y(0) - y(d.concluidas)) + '" fill="#C41420"><title>' + fDia(d.dia) + ': ' + d.concluidas + ' concluídas</title></rect>';
    if (n <= 8 || i % 2 === 1) s += '<text x="' + (pl + i * bw + bw / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + fDia(d.dia) + '</text>';
  });
  return s + '</svg>';
}
function vResumo() {
  var r = S.resumo;
  if (!r) return '<div class="vazio">Carregando…</div>';
  var k = r.kpis;
  return '<div class="cab"><h2>Últimos 7 dias</h2><span class="sec2">' + fDia(r.periodo.de) + ' a ' + fDia(r.periodo.ate) + '</span><button class="btn lim pq" data-a="recarregaresumo">Atualizar</button></div>' +
    '<div class="grandes"><div><b>' + k.concluidas_7d + '</b><span>Entregas</span><small>' + k.criadas_7d + ' tarefas novas</small></div>' +
    '<div><b>' + pct(k.prazo_7d) + '</b><span>No prazo</span><small>' + (k.prazo_base ? 'de ' + plural(k.prazo_base, 'entrega com prazo', 'entregas com prazo') : 'nenhuma entrega com prazo') + '</small></div>' +
    '<div><b>' + k.abertas + '</b><span>Em aberto</span><small>hoje</small></div>' +
    '<div><b class="' + (k.atrasadas ? 'r' : '') + '">' + k.atrasadas + '</b><span>Atrasadas</span><small>abertas e com prazo vencido</small></div>' +
    '<div><b>' + k.aguardando + '</b><span>Aguardando terceiros</span><small>dependem de outra área</small></div></div>' +
    '<section class="painel pad bloco"><div class="cab"><h3>Criadas e concluídas por dia</h3><div class="tot" style="margin:0"><div><i class="am" style="background:#B7BBC2"></i>Criadas</div><div><i class="am" style="background:#C41420"></i>Concluídas</div></div></div>' + grafico(r.porDia) + '</section>' +
    '<div class="duas bloco"><section class="painel pad"><h3>Equipe nos 7 dias</h3><div class="rolar" style="margin-top:8px"><table class="tb"><thead><tr><th>Pessoa</th><th class="d">Em tarefa</th><th class="d">Do dia registrado</th><th class="d">Entregas</th><th class="d">Abertas</th></tr></thead><tbody>' +
    r.pessoas.map(function (p) { return '<tr><td><b>' + esc(p.nome) + '</b></td><td class="d num">' + fMin(p.T) + '</td><td class="d num">' + (p.J ? pct(Math.max(0, (p.J - p.S) / p.J)) : '—') + '</td><td class="d num">' + p.concluidas + '</td><td class="d num">' + p.abertas + '</td></tr>'; }).join('') +
    '</tbody></table></div><p class="sec2 pq" style="margin:12px 0 0">“Do dia registrado” é a parte da jornada explicada por registros. Não mede esforço.</p></section>' +
    '<section class="painel pad"><h3>Aguardando terceiros</h3>' + (r.aguardando.length ? '<table class="tb" style="margin-top:8px"><tbody>' + r.aguardando.map(function (a) { return '<tr><td><b>' + esc(a.titulo) + '</b><div class="pq sec2">' + esc(a.responsavel) + ': ' + esc(a.motivo) + '</div></td><td class="pq sec2 d">' + fRel(a.desde) + '</td></tr>'; }).join('') + '</tbody></table>' : '<p class="sec2">Nenhuma tarefa esperando outra área.</p>') + '</section></div>' +
    '<section class="painel pad bloco"><h3>Pendências relevantes</h3><p class="sec2 pq" style="margin:2px 0 8px">Atrasadas ou com prioridade alta</p>' + (r.criticas.length ? '<div class="rolar"><table class="tb"><thead><tr><th>Tarefa</th><th>Responsável</th><th>Prioridade</th><th>Prazo</th><th>Status</th></tr></thead><tbody>' +
    r.criticas.map(function (c) { return '<tr><td><b>' + esc(c.titulo) + '</b> <span class="pq sec2">' + c.id + '</span></td><td>' + esc(c.responsavel) + '</td><td>' + esc(c.prioridade) + '</td><td' + (c.atrasada ? ' class="atrasado"' : '') + '>' + (c.prazo ? fDH(c.prazo) : '—') + '</td><td>' + esc(c.status) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<p class="sec2">Nenhuma pendência relevante.</p>') + '</section>';
}

/* ======================= Pessoas (admin) ======================= */
function carregarAdmin() { return api('admin_usuarios').then(function (d) { if (d) { S.admin = d; if (S.view === 'admin') render(); } }); }
function vAdmin() {

  if (!a) return '<div class="vazio">Carregando…</div>';
  var perf = function (sel, id) { return '<select class="inp" id="' + id + '">' + a.perfis.map(function (p) { return '<option value="' + p + '"' + (p === sel ? ' selected' : '') + '>' + p.charAt(0) + p.slice(1).toLowerCase() + '</option>'; }).join('') + '</select>'; };
  return '<div class="cab"><h2>Pessoas</h2></div><section class="painel pad"><h3>Adicionar pessoa</h3><div class="grade" style="grid-template-columns:2fr 1fr 1fr 1fr auto;align-items:end">' +
    '<label class="campo"><span>Nome</span><input class="inp" id="u_nome"></label><label class="campo"><span>Perfil</span>' + perf('ASSISTENTE', 'u_perf') + '</label>' +
    '<label class="campo"><span>Entrada</span><input class="inp" type="time" id="u_ji" value="09:00"></label><label class="campo"><span>Saída</span><input class="inp" type="time" id="u_jf" value="18:00"></label>' +
    '<button class="btn pri" style="margin-top:14px" data-a="criarusuario">Adicionar</button></div></section>' +

    a.usuarios.map(function (u) {
      var i = u.usuario_id;
      return '<tr><td><input class="inp" id="un_' + i + '" value="' + esc(u.nome) + '" aria-label="Nome"></td><td>' + perf(u.perfil, 'up_' + i) + '</td>' +
        '<td style="white-space:nowrap"><input class="inp" type="time" id="uji_' + i + '" value="' + esc(u.jornada_inicio) + '" style="width:112px" aria-label="Entrada"> às <input class="inp" type="time" id="ujf_' + i + '" value="' + esc(u.jornada_fim) + '" style="width:112px" aria-label="Saída"></td>' +
        '<td><select class="inp" id="ua_' + i + '"><option value="sim"' + (u.ativo === 'sim' ? ' selected' : '') + '>Ativo</option><option value="nao"' + (u.ativo !== 'sim' ? ' selected' : '') + '>Inativo</option></select></td>' +
        '<td>' + (u.bloqueado ? '<span class="tag atr">Bloqueado</span>' : u.pin_temporario ? '<span class="tag par">Temporário</span>' : '<span class="tag ok">Definido</span>') + '</td>' +
        '<td style="white-space:nowrap"><button class="btn esc pq" data-a="salvarusuario" data-id="' + i + '">Salvar</button> <button class="btn pq" data-a="resetpin" data-id="' + i + '">Gerar novo PIN</button></td></tr>';
    }).join('') + '</tbody></table></section>' +
    '<p class="sec2 pq">Permissões por perfil, categorias, prioridades e limites de tempo ficam na aba CONFIG da planilha.</p>';
}
function mostrarPin(r) {
  janela('<h2>PIN temporário de ' + esc(r.nome) + '</h2><div class="pingrande">' + esc(r.pin) + '</div><p class="sec2">Entregue pessoalmente. No primeiro acesso a pessoa cria o próprio PIN e este deixa de valer. Ele não aparece de novo.</p><button class="btn esc larg" data-a="fecha">Anotei</button>');
}

/* ======================= cliques ======================= */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-a]');
  if (!el) return;
  var a = el.getAttribute('data-a'), id = el.getAttribute('data-id');
  if (a === 'fecha' && el.classList.contains('fundo') && ev.target.closest('[data-stop]')) return;
  if (S.busy && el.tagName === 'BUTTON') return;
  var simples = { exp_ini: 'expediente_iniciar', exp_fim: 'expediente_encerrar', int_ini: 'intervalo_iniciar', int_fim: 'intervalo_encerrar' };
  if (simples[a]) {
    if (a === 'exp_fim' && !window.confirm(S.st.meuEstado.estado === 'TAREFA' ? 'Encerrar o expediente? A tarefa em andamento será pausada.' : 'Encerrar o expediente de hoje?')) return;
    return api(simples[a], {}, true).then(function (st) { if (aplicar(st)) S.fech = null; });
  }
  switch (a) {
    case 'selu': S.selUser = id; renderLogin(); break;
    case 'voltalogin': S.selUser = null; renderLogin(); break;
    case 'entrar': entrar(); break;
    case 'trocarpin':
      api('trocar_pin', { pin: $('#np1').value.trim(), confirmacao: $('#np2').value.trim() }, true).then(function (st) { if (st) { toast('PIN salvo.', 'ok'); aplicar(st); } }); break;
    case 'sair':
      api('sair', {}, true).then(function () { S.token = null; try { sessionStorage.removeItem('opshub_t'); } catch (e) {} S.resumo = S.admin = S.fech = null; fechar(); iniciarLogin(); }); break;
    case 'nav': S.view = el.getAttribute('data-v'); fechar();
      if (S.view === 'resumo') S.resumo = null; if (S.view === 'fechamento') S.fech = null; if (S.view === 'admin') S.admin = null;
      render(); window.scrollTo(0, 0); break;
    case 'modo': S.f.modo = el.getAttribute('data-m'); render(); break;
    case 'abrir': if (ev.target.closest('button')) return; abrirTarefa(id); break;
    case 'fecha': fechar(); break;
    case 'nova': janelaNova(); break;
    case 'criar':
      api('tarefa_criar', { titulo: $('#n_tit').value, responsavel_id: $('#n_resp') ? $('#n_resp').value : '', categoria: $('#n_cat').value, prioridade: $('#n_prio').value,
        prazo: $('#n_prazo').value, estimado_min: $('#n_est').value, descricao: $('#n_desc').value }, true)
        .then(function (st) { if (aplicar(st)) { fechar(); toast('Tarefa criada.', 'ok'); } }); break;
    case 'tacao': acaoTarefa(id, el.getAttribute('data-acao'), ''); break;
    case 'aguardar': janelaMotivo('Aguardar terceiros', 'De quem ou de qual retorno esta tarefa depende?', 'aguardar', id, true, 'Marcar como aguardando'); break;
    case 'reabrir': janelaMotivo('Reabrir tarefa', 'Por que ela precisa ser reaberta?', 'reabrir', id, false, 'Reabrir'); break;
    case 'cancelar': janelaMotivo('Cancelar tarefa', 'Por que ela está sendo cancelada?', 'cancelar', id, false, 'Cancelar tarefa'); break;
    case 'motivook':
      var mot = $('#m_mot').value.trim();
      if (el.getAttribute('data-obrig') === '1' && !mot) return toast('Preencha o motivo.', 'erro');
      var tid = id, ac = el.getAttribute('data-acao'); fechar(); acaoTarefa(tid, ac, mot); break;
    case 'comentar':
      var txt = $('#e_com').value.trim(); if (!txt) return;
      api('tarefa_acao', { tarefa_id: id, acao: 'comentar', motivo: txt }, true).then(function (st) { if (aplicar(st)) abrirTarefa(id); }); break;
    case 'salvaredit':
      var t = S.st.tarefas.find(function (x) { return x.tarefa_id === id; });
      api('tarefa_editar', { tarefa_id: id, versao: t.versao, titulo: $('#e_tit').value, responsavel_id: $('#e_resp') ? $('#e_resp').value : undefined,
        prioridade: $('#e_prio').value, prazo: $('#e_prazo').value, estimado_min: $('#e_est').value, descricao: $('#e_desc').value }, true)
        .then(function (st) { if (aplicar(st)) { toast('Alterações salvas.', 'ok'); abrirTarefa(id); } }); break;
    case 'enviarfech':
      var p = {}; ['realizado', 'concluidas', 'pendente', 'dificuldade', 'terceiros', 'prioridade_amanha'].forEach(function (k) { p[k] = $('#f_' + k).value; });
      api('fechamento_enviar', p, true).then(function (st) { if (aplicar(st)) { toast('Fechamento enviado.', 'ok'); S.fech = null; carregarFech(); } }); break;
    case 'recarregaresumo': S.resumo = null; render(); break;
    case 'criarusuario':
      api('admin_criar_usuario', { nome: $('#u_nome').value, perfil: $('#u_perf').value, jornada_inicio: $('#u_ji').value, jornada_fim: $('#u_jf').value }, true)
        .then(function (r) { if (r) { mostrarPin(r); S.admin = null; carregarAdmin(); atualizar(); } }); break;
    case 'salvarusuario':
      api('admin_atualizar_usuario', { usuario_id: id, nome: $('#un_' + id).value, perfil: $('#up_' + id).value, jornada_inicio: $('#uji_' + id).value, jornada_fim: $('#ujf_' + id).value, ativo: $('#ua_' + id).value }, true)
        .then(function (r) { if (r) { S.admin = r; toast('Dados salvos.', 'ok'); render(); } }); break;
    case 'resetpin':
      api('admin_reset_pin', { usuario_id: id }, true).then(function (r) { if (r) { mostrarPin(r); S.admin = null; carregarAdmin(); } }); break;
  }
});
function acaoTarefa(id, acao, motivo) {
  var t = S.st.tarefas.find(function (x) { return x.tarefa_id === id; });
  api('tarefa_acao', { tarefa_id: id, acao: acao, motivo: motivo, versao: t ? t.versao : '' }, true).then(function (st) {
    if (aplicar(st)) { S.fech = null; if (S.drawer) abrirTarefa(id); }
  });
}
document.addEventListener('input', function (ev) {
  if (ev.target.id === 'fbusca') { S.f.busca = ev.target.value; var pos = ev.target.selectionStart; render(); var b = $('#fbusca'); b.focus(); b.setSelectionRange(pos, pos); }
});
document.addEventListener('change', function (ev) {
  var id = ev.target.id;
  if (id === 'fresp') { S.f.resp = ev.target.value; render(); }
  if (id === 'fprio') { S.f.prio = ev.target.value; render(); }
  if (id === 'fconcl') { S.f.concl = ev.target.checked; render(); }
});
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && $('#ovl').innerHTML) fechar(); });

/* ======================= relógio ======================= */
function tick() {
  var n = agoraMs();
  document.querySelectorAll('[data-since]').forEach(function (e) { e.textContent = fDur(n - Date.parse(e.getAttribute('data-since'))); });
  document.querySelectorAll('[data-live]').forEach(function (e) { var b = Number(e.getAttribute('data-base')) || 0; e.textContent = fDur(b * 60000 + n - Date.parse(e.getAttribute('data-live'))); });
  document.querySelectorAll('[data-resp]').forEach(function (e) { e.textContent = fMin((n - Date.parse(e.getAttribute('data-resp'))) / 60000); });
}
setInterval(tick, 1000);
setInterval(function () { if (S.token && !S.busy && !document.hidden && !$('#ovl').innerHTML && ['TEXTAREA', 'INPUT', 'SELECT'].indexOf(document.activeElement.tagName) < 0) atualizar(); }, 60000);
document.addEventListener('visibilitychange', function () { if (!document.hidden && S.token && !$('#ovl').innerHTML) atualizar(); });

/* ======================= início ======================= */
(function () {
  var semGas = !(window.google && google.script && google.script.run);
  if (semGas && !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_URL)) {
    $('#app').innerHTML = telaEntrada('<h2>Falta conectar ao servidor</h2><p class="sec2">Abra o index.html, cole a URL da implantação do Apps Script (termina em /exec) na linha <code>var API_URL</code> e publique de novo.</p>');
    return;
  }
  var t = null; try { t = sessionStorage.getItem('opshub_t'); } catch (e) {}
  if (t) { S.token = t; api('estado').then(function (st) { if (!aplicar(st)) iniciarLogin(); }); }
  else iniciarLogin();
})();
</script>
